<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0C0C0C" />
    <title>Page Not Found — Harshit.io</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
        font-family: Kanit, Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0c0c0c;
        color: #f4f7fa;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(ellipse at 50% 35%, rgba(93, 116, 135, 0.18), transparent 48%),
          #0c0c0c;
      }
      main { width: min(100%, 680px); text-align: center; }
      .eyebrow {
        color: #a6b5c2;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      h1 {
        margin: 22px 0 16px;
        font-size: clamp(3rem, 13vw, 7rem);
        line-height: 0.92;
        letter-spacing: -0.055em;
        font-weight: 900;
        text-transform: uppercase;
        background: linear-gradient(180deg, #f4f7fa, #8296a5);
        color: transparent;
        background-clip: text;
        -webkit-background-clip: text;
      }
      p {
        max-width: 460px;
        margin: 0 auto;
        color: #9da8b1;
        font-size: clamp(0.95rem, 3vw, 1.1rem);
        line-height: 1.7;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        margin-top: 30px;
        padding: 0 24px;
        border: 1px solid rgba(215, 226, 234, 0.75);
        border-radius: 999px;
        color: #f4f7fa;
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-decoration: none;
        text-transform: uppercase;
        transition: color 180ms ease, background 180ms ease;
      }
      a:hover, a:focus-visible { background: #f4f7fa; color: #0c0c0c; }
      a:focus-visible { outline: 3px solid #9db7c8; outline-offset: 4px; }
      @media (prefers-reduced-motion: reduce) { a { transition: none; } }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Harshit.io · 404</div>
      <h1>Lost in space.</h1>
      <p>The page you’re looking for may have moved or the link may be outdated. Let’s get you back to the work.</p>
      <a href="/">Back to portfolio <span aria-hidden="true">&nbsp;↗</span></a>
    </main>
  </body>
</html>
