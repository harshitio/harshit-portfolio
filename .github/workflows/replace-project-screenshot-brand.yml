name: Replace former brand in project screenshots

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  replace-project-screenshot-brand:
    if: startsWith(github.head_ref, 'replace-velcora-screenshots')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install OCR and image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          python -m pip install --upgrade pip
          python -m pip install pillow opencv-python-headless pytesseract numpy

      - name: Replace visible brand text in screenshots
        run: python scripts/replace_project_screenshot_brand.py

      - name: Build the restored portfolio
        run: |
          npm ci
          npm run build

      - name: Save screenshot changes to the pull request branch
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/projects brand-replacement-report.json
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
            exit 1
          fi
          git commit -m "Replace former project brand with Harshit in screenshots [skip ci]"
          git push origin "HEAD:$BRANCH_NAME"

      - name: Upload edited screenshots for review
        uses: actions/upload-artifact@v4
        with:
          name: harshit-branded-project-screenshots
          path: |
            public/projects/**/*.webp
            brand-replacement-report.json
